<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Music App</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F3EEE3">
<style>
  :root{
    --cream:#F3EEE3;
    --ink:#191919;
    --orange:#F2603F;
    --orange-dark:#D9502F;
    --navy:#3E4CA0;
    --navy-dark:#2E3A82;
    --lav:#B7A6F2;
    --mint:#8FE0CE;
    --yellow:#F6E96B;
    --card:#FFFFFF;
    --line:#E7E0D2;
    --muted:#8B8577;
    --shadow: 0 3px 0 rgba(25,25,25,0.9);
    --radius: 20px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior:none;
  }
  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    position:relative;
    padding-bottom:92px;
    background:var(--cream);
  }
  /* ---------- Header ---------- */
  header.topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:22px 18px 6px;
  }
  .brand{display:flex;align-items:center;gap:8px;}
  .brand h1{
    font-size:26px;margin:0;font-weight:800;letter-spacing:-0.5px;
  }
  .beta{
    background:var(--ink);color:var(--cream);
    font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;
    transform:rotate(-3deg);
  }
  .avatar{
    width:38px;height:38px;border-radius:50%;
    background:var(--lav);display:flex;align-items:center;justify-content:center;
    border:2px solid var(--ink);
    font-size:18px;
  }
  .searchwrap{padding:10px 18px 18px;}
  .searchbar{
    display:flex;align-items:center;gap:8px;
    background:var(--card);border:1.5px solid var(--ink);
    border-radius:24px;padding:10px 16px;
    font-size:13px;color:var(--muted);
  }
  .searchbar input{
    border:none;outline:none;background:transparent;flex:1;
    font-size:14px;color:var(--ink);font-family:inherit;
  }
  .searchbar svg{flex-shrink:0;}

  section.view{padding:0 18px 8px;display:none;}
  section.view.active{display:block;}

  .section-label{
    font-size:11px;font-weight:700;letter-spacing:0.3px;color:var(--muted);
    margin:18px 0 8px;text-transform:none;
  }

  /* ---------- Category Cards (Scroll Horizontal Ke Samping) ---------- */
  .category-grid{
    display: flex;
    gap: 16px;
    overflow-x: auto;
    padding-bottom: 8px;
    padding-top: 6px;
    margin-bottom: 18px;
    margin-left: -18px;
    margin-right: -18px;
    padding-left: 18px;
    padding-right: 18px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .category-grid::-webkit-scrollbar {
    display: none;
  }
  .cat-card{
    width: 200px;
    flex-shrink: 0;
    background: var(--card);
    border: 2px solid var(--ink);
    border-radius: 16px;
    overflow: visible; 
    box-shadow: var(--shadow);
    cursor: pointer;
    position: relative;
    transition: transform 0.15s ease;
  }
  .cat-card:active{
    transform: translateY(2px);
    box-shadow: 0 1px 0 rgba(25,25,25,0.9);
  }
  .cat-card.active{
    border-color: var(--orange);
    background: #FFFDF7;
  }
  .cat-banner{
    height: 75px;
    background: linear-gradient(135deg, var(--navy), var(--navy-dark));
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    color: #fff;
    border-top-left-radius: 14px;
    border-top-right-radius: 14px;
  }
  .cat-badge{
    position: absolute;
    top: -10px;
    left: 10px;
    background: var(--yellow);
    border: 1.5px solid var(--ink);
    font-size: 10px;
    font-weight: 800;
    padding: 3px 8px;
    border-radius: 8px;
    transform: rotate(-6deg);
    text-transform: uppercase;
    z-index: 2;
    box-shadow: 0 2px 0 rgba(25,25,25,0.15);
  }
  .cat-info{
    padding: 10px 12px;
  }
  .cat-title{
    font-size: 13.5px;
    font-weight: 800;
    line-height: 1.2;
    margin-bottom: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .cat-sub{
    font-size: 10.5px;
    color: var(--muted);
    font-weight: 600;
  }

  /* ---------- Now playing hero card (Home) ---------- */
  .player-card{
    background:var(--card);border:1.5px solid var(--ink);
    border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);
    position:relative;margin-bottom:18px;
  }
  .player-top{display:flex;gap:12px;}
  .cover{
    width:96px;height:96px;border-radius:14px;object-fit:cover;
    background:linear-gradient(160deg,var(--navy),#20265e);
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:28px;
  }
  .np-tag{
    position:absolute;top:-10px;left:10px;
    background:#F6E96B;border:1.5px solid var(--ink);
    font-size:10px;font-weight:800;padding:3px 8px;border-radius:8px;
    transform:rotate(-6deg);
  }
  .playing-tag{
    position:absolute;top:-10px;right:14px;
    background:var(--mint);border:1.5px solid var(--ink);
    font-size:10px;font-weight:800;padding:3px 10px;border-radius:10px;
    transform:rotate(4deg);
  }
  .np-info{flex:1;min-width:0;padding-top:4px;}
  .np-info .label{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:2px;}
  .np-title{font-size:19px;font-weight:800;line-height:1.15;margin:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .np-artist{font-size:13px;color:var(--muted);margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .transport{display:flex;align-items:center;gap:14px;margin-top:4px;}
  .transport button{
    background:none;border:none;cursor:pointer;color:var(--ink);
    display:flex;align-items:center;justify-content:center;padding:0;
  }
  .transport .playbtn{
    width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--cream);
  }
  .np-progress{margin-top:12px;}
  .bar-row{display:flex;align-items:center;gap:8px;}
  .time{font-size:10px;color:var(--muted);width:32px;flex-shrink:0;}
  input[type=range]{
    -webkit-appearance:none;width:100%;height:4px;border-radius:4px;
    background:var(--line);outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:14px;height:14px;border-radius:50%;
    background:var(--orange);border:2px solid var(--ink);cursor:pointer;
  }
  .modebtns{display:flex;gap:8px;margin-top:12px;}
  .modebtn{
    border:1.3px solid var(--ink);background:var(--cream);border-radius:10px;
    padding:6px 10px;font-size:11px;font-weight:700;display:flex;align-items:center;gap:5px;
    cursor:pointer;
  }
  .modebtn.on{background:var(--orange);color:#fff;}

  /* ---------- Queue list / song rows ---------- */
  .song-row{
    display:flex;align-items:center;gap:12px;background:var(--card);
    border:1.3px solid var(--ink);border-radius:14px;padding:9px 12px;margin-bottom:9px;
  }
  .song-row.active{background:#FCEFC9;}
  .row-thumb{
    width:38px;height:38px;border-radius:9px;flex-shrink:0;
    background:linear-gradient(160deg,var(--orange),#c94324);
    display:flex;align-items:center;justify-content:center;color:#fff;
  }
  .row-mid{flex:1;min-width:0;}
  .row-title{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row-artist{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row-right{display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .row-time{font-size:11px;color:var(--muted);}
  .icon-btn{background:none;border:none;cursor:pointer;color:var(--ink);display:flex;padding:2px;}
  .empty-hint{
    text-align:center;color:var(--muted);font-size:13px;padding:26px 10px;
    border:1.5px dashed var(--line);border-radius:14px;
  }

  /* ---------- trending chips (search) ---------- */
  .trend-row{display:flex;align-items:center;gap:12px;background:var(--card);
    border:1.3px solid var(--ink);border-radius:14px;padding:9px 12px;margin-bottom:9px;}
  .rank{font-size:16px;font-weight:800;color:var(--lav);width:20px;text-align:center;flex-shrink:0;}

  /* ---------- Profile / playlists ---------- */
  .pl-card{
    background:var(--card);border:1.3px solid var(--ink);border-radius:16px;
    padding:14px;margin-bottom:12px;display:flex;align-items:center;gap:12px;
    cursor:pointer;
  }
  .pl-icon{
    width:46px;height:46px;border-radius:12px;flex-shrink:0;
    background:var(--navy);display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;
  }
  .pl-name{font-weight:800;font-size:14.5px;}
  .pl-count{font-size:11.5px;color:var(--muted);}
  .addbtn{
    width:100%;border:1.5px dashed var(--ink);background:none;border-radius:14px;
    padding:12px;font-weight:700;font-size:13.5px;cursor:pointer;color:var(--ink);
    margin-top:6px;
  }

  /* ---------- Footer nav ---------- */
  nav.footer{
    position:fixed;left:0;right:0;bottom:0;
    max-width:480px;margin:0 auto;
    background:var(--ink);border-radius:22px 22px 0 0;
    display:flex;justify-content:space-around;align-items:center;
    padding:12px 10px calc(10px + env(safe-area-inset-bottom));
    box-shadow:0 -4px 14px rgba(0,0,0,0.12);
  }
  nav.footer button{
    background:none;border:none;color:#9C9887;display:flex;flex-direction:column;
    align-items:center;gap:4px;font-size:10.5px;cursor:pointer;font-family:inherit;
    padding:4px 14px;font-weight:600;
  }
  nav.footer button.active{color:var(--cream);}

  .mini-toast{
    position:fixed;left:50%;bottom:100px;transform:translateX(-50%);
    background:var(--ink);color:var(--cream);padding:9px 18px;border-radius:20px;
    font-size:12.5px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s;
    z-index:50;max-width:340px;text-align:center;
  }
  .mini-toast.show{opacity:1;}

  .modal-bg{
    position:fixed;inset:0;background:rgba(20,18,10,0.45);display:none;
    align-items:flex-end;justify-content:center;z-index:60;
  }
  .modal-bg.show{display:flex;}
  .modal{
    background:var(--cream);width:100%;max-width:480px;border-radius:22px 22px 0 0;
    padding:18px;max-height:82vh;overflow-y:auto;
  }
  .modal h3{margin:0 0 4px;font-size:17px;}
  .modal .close-x{position:absolute;top:14px;right:20px;background:none;border:none;font-size:18px;cursor:pointer;}
  .modal-wrap{position:relative;}
  .form-card{
    background:var(--card);border:1.3px solid var(--ink);border-radius:16px;
    padding:14px;margin-bottom:16px;
  }
  .form-card label{font-size:11px;font-weight:700;color:var(--muted);display:block;margin:8px 0 4px;}
  .form-card input{
    width:100%;border:1.3px solid var(--line);border-radius:10px;padding:10px 12px;
    font-size:13.5px;font-family:inherit;outline:none;background:#FCFBF7;
  }
  .btn-primary{
    background:var(--ink);color:var(--cream);border:none;border-radius:12px;
    padding:11px;font-weight:700;font-size:13.5px;width:100%;margin-top:12px;cursor:pointer;
  }
</style>
</head>
<body>
<div id="app">

  <header class="topbar">
    <div class="brand">
      <h1>MUSIC APP</h1>
      <span class="beta">Alhawari17</span>
    </div>
    <div class="avatar">🎧</div>
  </header>

  <div class="searchwrap" id="topSearchWrap">
    <div class="searchbar" onclick="goto('search')" style="cursor:pointer">
      <span id="topSearchLabel">Cari judul lagu atau penyanyi…</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-left:auto"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </div>
  </div>

  <!-- ===================== HOME ===================== -->
  <section class="view active" id="view-home">
    <div class="player-card" id="playerCard">
      <span class="np-tag" id="npTag">NOW PLAYING</span>
      <span class="playing-tag" id="playingTag">Pause</span>
      <div class="player-top">
        <div class="cover" id="npCover">♪</div>
        <div class="np-info">
          <div class="label" id="activeCategoryLabel">KATEGORI: SEMUA LAGU</div>
          <div class="np-title" id="npTitle">Memuat lagu...</div>
          <div class="np-artist" id="npArtist">GitHub Repository</div>
          <div class="transport">
            <button id="btnPrev" title="Sebelumnya">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM20 6L9 12l11 6z"/></svg>
            </button>
            <button class="playbtn" id="btnPlay" title="Putar">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" id="playIcon"><path d="M8 5v14l11-7z"/></svg>
            </button>
            <button id="btnNext" title="Berikutnya">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM4 6l11 6-11 6z"/></svg>
            </button>
          </div>
        </div>
      </div>
      <div class="np-progress">
        <div class="bar-row">
          <span class="time" id="npCur">00:00</span>
          <input type="range" id="seekbar" min="0" max="100" value="0">
          <span class="time" id="npDur" style="text-align:right">00:00</span>
        </div>
      </div>
      <div class="modebtns">
        <button class="modebtn" id="btnShuffle" title="Acak">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
          Acak
        </button>
        <button class="modebtn" id="btnRepeat" title="Ulangi">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
          Ulangi
        </button>
      </div>
    </div>

    <!-- Posisi Kategori Musik -->
    <div class="section-label" style="margin-top:0">Kategori Musik</div>
    <div class="category-grid" id="categoryGrid">
      <!-- Kartu Kategori dirender lewat JS -->
    </div>

    <div class="section-label" id="queueHeaderLabel">Antrean selanjutnya (Semua Lagu)</div>
    <div id="queueList"></div>
  </section>

  <!-- ===================== SEARCH / LIBRARY ===================== -->
  <section class="view" id="view-search">
    <div class="searchbar" style="margin-bottom:12px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="searchInput" placeholder="Cari judul lagu atau penyanyi…">
    </div>

    <div class="section-label">🔥 Musik trending</div>
    <div id="trendingList"></div>

    <div class="section-label">Semua lagu</div>
    <div id="allSongsList"></div>
  </section>

  <!-- ===================== PROFILE / PLAYLISTS ===================== -->
  <section class="view" id="view-profile">
    <div class="section-label" style="margin-top:14px">Playlist saya</div>
    <div id="playlistList"></div>
    <button class="addbtn" id="btnNewPlaylist">+ Buat playlist baru</button>

    <div id="playlistDetail" style="display:none;margin-top:18px">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div class="section-label" id="pdName" style="margin:0;font-size:15px;color:var(--ink)"></div>
        <div style="display:flex;gap:10px">
          <button class="icon-btn" id="pdEdit" title="Ganti nama">✏️</button>
          <button class="icon-btn" id="pdDelete" title="Hapus">🗑️</button>
          <button class="icon-btn" id="pdBack" title="Kembali">✕</button>
        </div>
      </div>
      <div id="pdSongs" style="margin-top:10px"></div>
    </div>
  </section>

  <nav class="footer">
    <button class="active" data-tab="home" onclick="goto('home')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h14V10"/></svg>
      Beranda
    </button>
    <button data-tab="search" onclick="goto('search')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      Pencarian
    </button>
    <button data-tab="profile" onclick="goto('profile')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
      Profil
    </button>
  </nav>

  <audio id="audio" preload="metadata"></audio>
  <div class="mini-toast" id="toast"></div>

  <!-- Modal: new/rename playlist -->
  <div class="modal-bg" id="modalPlaylist">
    <div class="modal-wrap">
      <div class="modal">
        <button class="close-x" onclick="closeModal('modalPlaylist')">✕</button>
        <h3 id="plModalTitle">Playlist baru</h3>
        <div class="form-card" style="box-shadow:none;border:none;padding:8px 0">
          <label>Nama playlist</label>
          <input id="fPlaylistName" placeholder="Contoh: Lagu Santai">
          <button class="btn-primary" id="btnSavePlaylist">Simpan</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal: add to playlist picker -->
  <div class="modal-bg" id="modalPicker">
    <div class="modal-wrap">
      <div class="modal">
        <button class="close-x" onclick="closeModal('modalPicker')">✕</button>
        <h3>Tambah ke playlist</h3>
        <div id="pickerList" style="margin-top:10px"></div>
      </div>
    </div>
  </div>

</div>

<script>
/* ============================================================
   DATA LAYER — GitHub Repository Integration
============================================================ */
const LS_PL = 'ma_playlists', LS_PLAYS = 'ma_plays';

let playlists = JSON.parse(localStorage.getItem(LS_PL) || '[]');
let playCounts = JSON.parse(localStorage.getItem(LS_PLAYS) || '{}');

// Daftar lagu diperbarui otomatis dari repository GitHub alhawari17/Musik (24 lagu)[cite: 16]
const rawFiles = [
  "1000X - Ghea Indrawari.mp3",
  "Bentang Jarak Asmara - Man Osman ft. Traffic Jam.mp3",
  "Berapa Kali Kita Akan Saling Memaafkan - Pamungkas.mp3",
  "Berharap Pada Timur - Salma Salsabil.mp3",
  "Bunga Hati - Salma Salsabil.mp3",
  "Ceritanya Jatuh Cinta - Aku Jeje.mp3",
  "Cha Cha Cha - Bruno Mars.mp3",
  "Disarankan Di Bandung - Dongker Feat Jason Ranti.mp3",
  "Everything U Are - Hindia.mp3",
  "Hey Daddy - Daddys Home.mp3",
  "Kita Buat Menyenangkan - Bernadya.mp3",
  "Kita Lewati Berdua - Overnight.mp3",
  "Kota Ini Tak Sama Tanpamu - Nadhif Basalamah.mp3",
  "Masa ini Nanti dan Masa Indah Lainnya - Nuca.mp3",
  "Nuh - Teruntuk Mia.mp3",
  "One In A Million - NeYo - (Reggea Version).mp3",
  "Putri Iklan - Keljo.mp3",
  "Risk It All - Bruno Mars.mp3",
  "Senja Sudut Kota - Samuel Cipta.mp3",
  "Shape of My Heart - Backstreet Boys.mp3",
  "So Easy (To Fall In Love) - Olivia Dean.mp3",
  "The Fate of Ophelia - Taylor Swift.mp3",
  "The One That Got Away - Katy Perry.mp3",
  "Too Good At Goodbyes - Sam Smith.mp3"
];

// Generate objek lagu secara dinamis dari nama file GitHub
let songs = rawFiles.map((filename, index) => {
  let cleanName = filename.replace(/\.mp3$/i, '');
  let parts = cleanName.split(' - ');
  let title = parts[0] ? parts[0].trim() : cleanName;
  let artist = parts.slice(1).join(' - ').trim() || 'Unknown Artist';
  
  return {
    id: 'git_' + index,
    title: title,
    artist: artist,
    filename: filename,
    url: `https://raw.githubusercontent.com/alhawari17/Musik/main/${encodeURIComponent(filename)}`,
    plays: playCounts['git_' + index] || 0
  };
});

/* ============================================================
   PLAYBACK STATE
============================================================ */
let queue = [...songs];
let currentIndex = 0;
let shuffleOn = false;
let repeatOn = false;
let currentCategoryName = 'Semua Lagu';

const audio = document.getElementById('audio');

function currentSong(){ return queue[currentIndex]; }

function setQueueSource(newList, categoryName, autoPlayFirst = false){
  queue = shuffleOn ? shuffleArray([...newList]) : [...newList];
  currentIndex = 0;
  currentCategoryName = categoryName;
  updateCategoryLabels();
  renderCategoryCards();
  if(autoPlayFirst && queue.length > 0){
    loadCurrent(true);
  } else {
    renderQueue();
  }
}

function updateCategoryLabels(){
  document.getElementById('activeCategoryLabel').textContent = 'KATEGORI: ' + currentCategoryName.toUpperCase();
  document.getElementById('queueHeaderLabel').textContent = 'Antrean selanjutnya (' + currentCategoryName + ')';
}

function shuffleArray(arr){
  let cloned = [...arr];
  for(let i=cloned.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [cloned[i],cloned[j]]=[cloned[j],cloned[i]]; }
  return cloned;
}

function playSongById(id, list, categoryName){
  if(list){
    setQueueSource(list, categoryName || 'Custom');
  } else if(queue.length === 0 || !queue.some(s => s.id === id)){
    setQueueSource(songs, 'Semua Lagu');
  }
  
  const idx = queue.findIndex(s=>s.id===id);
  currentIndex = idx > -1 ? idx : 0;
  loadCurrent(true);
}

function loadCurrent(autoplay){
  const s = currentSong();
  if(!s){ renderNowPlaying(); return; }
  audio.src = s.url;
  renderNowPlaying();
  renderQueue();
  updateMediaSession();
  if(autoplay){
    audio.play().catch(()=>toast('Tidak bisa memutar lagu. Periksa koneksi internet Anda.'));
  }
}

function togglePlay(){
  if(!currentSong()) return;
  if(!audio.src){ loadCurrent(true); return; }
  if(audio.paused) audio.play().catch(()=>toast('Gagal memutar lagu ini.'));
  else audio.pause();
}
function playNext(userTriggered){
  if(queue.length===0) return;
  if(repeatOn && !userTriggered){ audio.currentTime=0; audio.play(); return; }
  currentIndex = (currentIndex+1) % queue.length;
  bumpPlayCount(currentSong());
  loadCurrent(true);
}
function playPrev(){
  if(queue.length===0) return;
  if(audio.currentTime > 4){ audio.currentTime = 0; return; }
  currentIndex = (currentIndex-1+queue.length) % queue.length;
  loadCurrent(true);
}
function bumpPlayCount(s){
  if(!s) return;
  const t = songs.find(x=>x.id===s.id);
  if(t){
    t.plays = (t.plays||0)+1;
    playCounts[t.id] = t.plays;
    localStorage.setItem(LS_PLAYS, JSON.stringify(playCounts));
  }
}

audio.addEventListener('play', ()=>{
  setPlayIcon(true);
  const tag = document.getElementById('playingTag');
  tag.style.display = 'inline-block';
  tag.textContent = 'Playing';
});
audio.addEventListener('pause', ()=>{
  setPlayIcon(false);
  const tag = document.getElementById('playingTag');
  tag.style.display = 'inline-block';
  tag.textContent = 'Pause';
});
audio.addEventListener('ended', ()=> playNext(false));
audio.addEventListener('timeupdate', ()=>{
  if(!isFinite(audio.duration)) return;
  document.getElementById('seekbar').value = (audio.currentTime/audio.duration*100)||0;
  document.getElementById('npCur').textContent = fmtTime(audio.currentTime);
  document.getElementById('npDur').textContent = fmtTime(audio.duration);
});
document.getElementById('seekbar').addEventListener('input', e=>{
  if(isFinite(audio.duration)) audio.currentTime = e.target.value/100*audio.duration;
});
function fmtTime(t){ if(!isFinite(t)) return '00:00'; const m=Math.floor(t/60), s=Math.floor(t%60); return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`; }
function setPlayIcon(playing){
  document.getElementById('playIcon').innerHTML = playing
    ? '<rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/>'
    : '<path d="M8 5v14l11-7z"/>';
}

document.getElementById('btnPlay').onclick = togglePlay;
document.getElementById('btnNext').onclick = ()=>playNext(true);
document.getElementById('btnPrev').onclick = playPrev;
document.getElementById('btnShuffle').onclick = ()=>{
  shuffleOn = !shuffleOn;
  document.getElementById('btnShuffle').classList.toggle('on', shuffleOn);
  
  let activeList = (currentCategoryName === 'Semua Lagu') ? songs : (playlists.find(p => p.name === currentCategoryName)?.songIds.map(sid => songs.find(s => s.id === sid)).filter(Boolean) || songs);
  let currentId = currentSong()?.id;
  setQueueSource(activeList, currentCategoryName);
  if(currentId){
    const idx = queue.findIndex(s => s.id === currentId);
    if(idx > -1) currentIndex = idx;
  }
  renderQueue();
  toast(shuffleOn ? 'Mode acak diaktifkan' : 'Mode acak dimatikan');
};
document.getElementById('btnRepeat').onclick = ()=>{
  repeatOn = !repeatOn;
  document.getElementById('btnRepeat').classList.toggle('on', repeatOn);
  toast(repeatOn ? 'Ulangi lagu ini' : 'Ulangi dimatikan');
};

/* ---------- Media Session ---------- */
function updateMediaSession(){
  if(!('mediaSession' in navigator)) return;
  const s = currentSong();
  if(!s) return;
  navigator.mediaSession.metadata = new MediaMetadata({
    title: s.title, artist: s.artist, album: 'GitHub Music App',
    artwork: [{src:'icon-192.png', sizes:'192x192', type:'image/png'}]
  });
  navigator.mediaSession.setActionHandler('play', ()=>audio.play());
  navigator.mediaSession.setActionHandler('pause', ()=>audio.pause());
  navigator.mediaSession.setActionHandler('previoustrack', playPrev);
  navigator.mediaSession.setActionHandler('nexttrack', ()=>playNext(true));
}

/* ============================================================
   RENDERING
============================================================ */
const playlistGradients = [
  'linear-gradient(135deg, #F2603F, #c94324)', // Oranye
  'linear-gradient(135deg, #7B68EE, #483D8B)', // Ungu/Indigo
  'linear-gradient(135deg, #2E8B57, #006400)', // Hijau Tua
  'linear-gradient(135deg, #FF69B4, #C71585)', // Pink/Magenta
  'linear-gradient(135deg, #DAA520, #B8860B)', // Kuning Emas/Bronze
  'linear-gradient(135deg, #008B8B, #005F5F)'  // Tosca/Cyan
];

function renderCategoryCards(){
  const grid = document.getElementById('categoryGrid');
  let html = '';

  // Kumpulkan semua item kategori
  let allCategories = [
    { name: 'Semua Lagu', type: 'ALL', count: songs.length, bannerBg: 'linear-gradient(135deg,#3E4CA0,#20265e)', icon: '🎧' }
  ];

  playlists.forEach((p, idx) => {
    let gradColor = playlistGradients[idx % playlistGradients.length];
    allCategories.push({
      name: p.name,
      type: 'PLAYLIST',
      count: p.songIds.length,
      bannerBg: gradColor,
      icon: '🎵'
    });
  });

  // Urutkan kategori: Kategori yang aktif berada paling depan (paling kiri)
  allCategories.sort((a, b) => {
    if (a.name === currentCategoryName) return -1;
    if (b.name === currentCategoryName) return 1;
    return 0;
  });

  // Render HTML sesuai urutan yang sudah disesuaikan
  allCategories.forEach(cat => {
    const isActive = currentCategoryName === cat.name;
    html += `
      <div class="cat-card ${isActive ? 'active' : ''}" onclick="selectCategory('${esc(cat.name)}')">
        <span class="cat-badge">${cat.type}</span>
        <div class="cat-banner" style="background:${cat.bannerBg}">
          ${cat.icon}
        </div>
        <div class="cat-info">
          <div class="cat-title">${esc(cat.name)}</div>
          <div class="cat-sub">${cat.count} ${cat.type === 'ALL' ? 'lagu tersedia' : 'lagu'}</div>
        </div>
      </div>
    `;
  });

  grid.innerHTML = html;
}

function selectCategory(name){
  if(name === 'Semua Lagu'){
    setQueueSource(songs, 'Semua Lagu', true);
  } else {
    const p = playlists.find(x => x.name === name);
    if(p){
      const list = p.songIds.map(sid => songs.find(s => s.id === sid)).filter(Boolean);
      if(list.length === 0){
        toast('Playlist ini masih kosong. Tambahkan lagu dari pencarian.');
        return;
      }
      setQueueSource(list, p.name, true);
    }
  }
}

function renderNowPlaying(){
  const s = currentSong();
  document.getElementById('npTitle').textContent = s ? s.title : 'Belum ada lagu';
  document.getElementById('npArtist').textContent = s ? s.artist : 'GitHub Repository';
}

function renderQueue(){
  const el = document.getElementById('queueList');
  const upcoming = queue.slice(currentIndex+1).concat(queue.slice(0,currentIndex));
  if(upcoming.length===0){ el.innerHTML = emptyHint('Antrean kosong.'); return; }
  el.innerHTML = upcoming.map(s=>songRowHtml(s, s.id===currentSong()?.id)).join('');
  bindRowClicks(el, queue, currentCategoryName);
}
function emptyHint(text){ return `<div class="empty-hint">${text}</div>`; }

function songRowHtml(s, active){
  return `<div class="song-row ${active?'active':''}" data-id="${s.id}">
    <div class="row-thumb">♪</div>
    <div class="row-mid">
      <div class="row-title">${esc(s.title)}</div>
      <div class="row-artist">${esc(s.artist)}</div>
    </div>
    <div class="row-right">
      <button class="icon-btn" data-plus="${s.id}" title="Tambah ke playlist" style="font-size:16px;font-weight:bold">＋</button>
      <button class="icon-btn" data-play="${s.id}" title="Putar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="11" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10 8.5v7l6-3.5z"/></svg>
      </button>
    </div>
  </div>`;
}
function esc(t){ return (t||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function bindRowClicks(container, list, categoryName){
  container.querySelectorAll('[data-play]').forEach(b=>{
    b.onclick = ()=> playSongById(b.dataset.play, list, categoryName);
  });
  container.querySelectorAll('.song-row').forEach(r=>{
    r.onclick = (e)=>{ if(e.target.closest('button')) return; playSongById(r.dataset.id, list, categoryName); };
  });
  container.querySelectorAll('[data-plus]').forEach(b=>{
    b.onclick = (e)=>{ e.stopPropagation(); openPicker(b.dataset.plus); };
  });
}

function renderAllSongs(filter){
  const el = document.getElementById('allSongsList');
  let list = songs;
  if(filter) list = songs.filter(s => (s.title+' '+s.artist).toLowerCase().includes(filter.toLowerCase()));
  if(list.length===0){ el.innerHTML = emptyHint('Tidak ditemukan.'); return; }
  el.innerHTML = list.map(s=>songRowHtml(s, currentSong()?.id===s.id)).join('');
  bindRowClicks(el, songs, 'Semua Lagu');
}

function renderTrending(){
  const el = document.getElementById('trendingList');
  const top = [...songs].sort((a,b)=>(b.plays||0)-(a.plays||0)).slice(0,5);
  el.innerHTML = top.map((s,i)=>`
    <div class="trend-row" data-id="${s.id}">
      <div class="rank">${i+1}</div>
      <div class="row-thumb">♪</div>
      <div class="row-mid">
        <div class="row-title">${esc(s.title)}</div>
        <div class="row-artist">${esc(s.artist)}</div>
      </div>
      <div class="row-right"><span class="row-time">${s.plays||0}x diputar</span></div>
    </div>`).join('');
  el.querySelectorAll('.trend-row').forEach(r=> r.onclick = ()=>playSongById(r.dataset.id, songs, 'Semua Lagu'));
}

function renderPlaylists(){
  const el = document.getElementById('playlistList');
  if(playlists.length===0){ el.innerHTML = emptyHint('Belum ada playlist. Buat satu di bawah.'); return; }
  el.innerHTML = playlists.map(p=>`
    <div class="pl-card" data-id="${p.id}">
      <div class="pl-icon">🎵</div>
      <div>
        <div class="pl-name">${esc(p.name)}</div>
        <div class="pl-count">${p.songIds.length} lagu</div>
      </div>
    </div>`).join('');
  el.querySelectorAll('.pl-card').forEach(c=> c.onclick = ()=>openPlaylistDetail(c.dataset.id));
}

let openPlaylistId = null;
function openPlaylistDetail(id){
  openPlaylistId = id;
  const p = playlists.find(x=>x.id===id);
  document.getElementById('playlistDetail').style.display = 'block';
  document.getElementById('pdName').textContent = p.name;
  const list = p.songIds.map(sid=>songs.find(s=>s.id===sid)).filter(Boolean);
  const el = document.getElementById('pdSongs');
  if(list.length===0){ el.innerHTML = emptyHint('Playlist ini masih kosong.'); }
  else { 
    el.innerHTML = list.map(s=>songRowHtml(s, currentSong()?.id===s.id)).join(''); 
    bindRowClicks(el, list, p.name); 
  }
}
document.getElementById('pdBack').onclick = ()=>{ document.getElementById('playlistDetail').style.display='none'; openPlaylistId=null; };
document.getElementById('pdDelete').onclick = ()=>{
  if(!openPlaylistId) return;
  if(confirm('Hapus playlist ini?')){
    const deleted = playlists.find(p => p.id === openPlaylistId);
    playlists = playlists.filter(p=>p.id!==openPlaylistId);
    localStorage.setItem(LS_PL, JSON.stringify(playlists));
    document.getElementById('playlistDetail').style.display='none';
    
    if(deleted && currentCategoryName === deleted.name){
      setQueueSource(songs, 'Semua Lagu');
    } else {
      renderCategoryCards();
    }
    
    renderPlaylists();
    toast('Playlist dihapus');
  }
};
document.getElementById('pdEdit').onclick = ()=>{
  const p = playlists.find(x=>x.id===openPlaylistId);
  const name = prompt('Nama baru untuk playlist:', p.name);
  if(name && name.trim()){
    const oldName = p.name;
    p.name = name.trim();
    localStorage.setItem(LS_PL, JSON.stringify(playlists));
    if(currentCategoryName === oldName){
      currentCategoryName = p.name;
      updateCategoryLabels();
    }
    renderCategoryCards();
    openPlaylistDetail(p.id);
    renderPlaylists();
  }
};

/* ---------- Picker Modal ---------- */
let pickerSongId = null;
function openPicker(songId){
  pickerSongId = songId;
  const el = document.getElementById('pickerList');
  if(playlists.length===0){
    el.innerHTML = emptyHint('Belum ada playlist. Buat dulu di menu Profil.');
  } else {
    el.innerHTML = playlists.map(p=>`
      <div class="pl-card" data-id="${p.id}">
        <div class="pl-icon">🎵</div>
        <div><div class="pl-name">${esc(p.name)}</div><div class="pl-count">${p.songIds.length} lagu</div></div>
      </div>`).join('');
    el.querySelectorAll('.pl-card').forEach(c=>{
      c.onclick = ()=>{
        const p = playlists.find(x=>x.id===c.dataset.id);
        if(!p.songIds.includes(pickerSongId)) p.songIds.push(pickerSongId);
        localStorage.setItem(LS_PL, JSON.stringify(playlists));
        renderPlaylists();
        renderCategoryCards();
        toast(`Ditambahkan ke "${p.name}"`);
        closeModal('modalPicker');
      };
    });
  }
  openModal('modalPicker');
}

/* ============================================================
   NAV / TABS
============================================================ */
function goto(tab){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+tab).classList.add('active');
  document.querySelectorAll('nav.footer button').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  document.getElementById('topSearchWrap').style.display = tab==='search' ? 'none' : 'block';
  if(tab==='search') {
    document.getElementById('searchInput').focus({preventScroll:true});
    renderAllSongs(document.getElementById('searchInput').value);
    renderTrending();
  }
  if(tab==='profile') renderPlaylists();
  if(tab==='home') {
    renderCategoryCards();
    renderQueue();
  }
}

document.getElementById('searchInput').addEventListener('input', e=> renderAllSongs(e.target.value));

/* ---------- Modals ---------- */
function openModal(id){ document.getElementById(id).classList.add('show'); }
function closeModal(id){ document.getElementById(id).classList.remove('show'); }
document.querySelectorAll('.modal-bg').forEach(m=> m.addEventListener('click', e=>{ if(e.target===m) closeModal(m.id); }));

document.getElementById('btnNewPlaylist').onclick = ()=>{
  document.getElementById('plModalTitle').textContent = 'Playlist baru';
  document.getElementById('fPlaylistName').value='';
  openModal('modalPlaylist');
};
document.getElementById('btnSavePlaylist').onclick = ()=>{
  const name = document.getElementById('fPlaylistName').value.trim();
  if(!name){ toast('Isi nama playlist dulu.'); return; }
  playlists.push({id:'pl_' + Date.now(), name, songIds:[]});
  localStorage.setItem(LS_PL, JSON.stringify(playlists));
  closeModal('modalPlaylist');
  renderPlaylists();
  renderCategoryCards();
  toast('Playlist dibuat');
};

/* ---------- Toast ---------- */
let toastTimer;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ============================================================
   INIT
============================================================ */
setQueueSource(songs, 'Semua Lagu');
renderNowPlaying();
renderQueue();
renderAllSongs('');
renderTrending();
renderPlaylists();
</script>
</body>
</html>
